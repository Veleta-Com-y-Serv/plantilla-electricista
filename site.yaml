  zonas:
    activa: true
    antetitulo: Dónde trabajamos
    titulo: Tudela y toda la Ribera
    texto: "Salimos del taller a cualquier pueblo en un radio de 30 km. Si el tuyo no está en la lista, pregúntanos."
    imagen: /fotos/zonas.jpg
    titulo_pagina: "Electricista en {zona}"
    texto_pagina: "Instalaciones, boletines y averías en {zona}. Empresa instaladora autorizada, con presupuesto por escrito y garantía."
    items:
      - titulo: Tudela
        texto: "Aquí tenemos el taller, en el polígono La Serna, y aquí hacemos buena parte de nuestros trabajos: pisos del ensanche que necesitan un cuadro nuevo, casas del casco antiguo con instalaciones de hace décadas, comercios del centro y naves de los polígonos. En Tudela solemos llegar a una avería en el mismo día, y muchas veces en menos de una hora. Hacemos boletines para altas de luz, cambios de cuadro, puntos de recarga en garajes comunitarios y placas solares en viviendas unifamiliares."
      - titulo: Cintruénigo
        texto: "En Cintruénigo trabajamos sobre todo en viviendas y en garajes comunitarios, donde cada vez más vecinos instalan su punto de recarga para el coche eléctrico. Llevamos la línea desde el contador hasta la plaza, hacemos la legalización y te ayudamos con la comunicación a la comunidad. También atendemos averías, cambios de cuadro y boletines para altas o subidas de potencia, con el mismo precio de desplazamiento que en Tudela."
      - titulo: Corella
        texto: "Corella tiene muchas casas de pueblo con tejados amplios y bien orientados, ideales para el autoconsumo solar. Estudiamos tu consumo, te decimos cuántas placas te compensan y nos encargamos del trámite de compensación de excedentes. Además, renovamos instalaciones antiguas de casas que se reforman, ponemos iluminación LED en bodegas y almacenes y hacemos los boletines que pide la compañía."
      - titulo: Cascante
        texto: "En Cascante hacemos instalaciones completas en reformas de viviendas, desde la regata hasta el último enchufe, y mantenimiento eléctrico de comercios y pequeñas empresas. Revisamos también las instalaciones de comunidades de vecinos: alumbrado de escaleras, garajes y porteros automáticos. Si tienes una avería, llámanos y te decimos a qué hora podemos estar ahí."
      - { titulo: Ribaforada }
      - { titulo: Fitero }
      - { titulo: Murchante }
      - { titulo: Castejón }
      - { titulo: Fustiñana }
      - { titulo: Arguedas }

  opiniones:
    activa: true
