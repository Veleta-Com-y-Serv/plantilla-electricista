    boton_formulario: Pedir presupuesto
    items:
      - { titulo: Empresa instaladora autorizada, texto: "Inscrita en el registro de Industria de Navarra.", icono: certificado }
      - { titulo: Precio cerrado por escrito, texto: "Lo que firmas es lo que pagas.", icono: euro }
      - { titulo: Garantía de los trabajos, texto: "Por escrito, en cada factura.", icono: escudo }

  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Lo que nos preguntan antes de llamar
    preguntas:
      - { pregunta: "¿Cuánto tardáis en venir por una avería?", respuesta: "En Tudela solemos llegar en el día. Al llamar te decimos la hora aproximada y, si es una urgencia, salimos en cuanto podemos." }
      - { pregunta: "¿Hacéis el boletín para dar de alta la luz?", respuesta: "Sí. Revisamos la instalación, hacemos el certificado (CIE) y lo registramos en Industria. Si hay que arreglar algo antes, te lo decimos con precio." }
      - { pregunta: "¿Puedo poner un cargador en el garaje comunitario?", respuesta: "Sí. Basta con comunicarlo a la comunidad. Llevamos la línea desde tu contador hasta tu plaza y nos encargamos de la legalización." }
      - { pregunta: "¿Me compensa poner placas solares?", respuesta: "Depende de tu consumo y de tu tejado. Vamos a verlo y te decimos, sin compromiso, cuántas placas te compensan y lo que ahorrarías." }
      - { pregunta: "¿Trabajáis con comunidades y empresas?", respuesta: "Sí. Hacemos el mantenimiento de zonas comunes, locales y naves, con factura y contrato si lo necesitas." }

