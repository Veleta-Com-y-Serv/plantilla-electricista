  servicios:
    activa: true
    antetitulo: Servicios
    titulo: Todo lo eléctrico de tu casa o tu negocio
    texto: "Viviendas, comercios, comunidades y naves. Un mismo equipo para la instalación, los papeles y el mantenimiento."
    items:
      - titulo: Instalaciones eléctricas
        texto: "Nuevas o reformadas, en viviendas, locales y naves."
        icono: cable
        imagenes: "/fotos/servicio-instalacion.jpg; /fotos/trabajo-nave.jpg"
        detalle: |
          Hacemos la instalación eléctrica completa de viviendas, locales y naves, tanto en obra nueva como en reformas. Calculamos la potencia que necesitas, separamos los circuitos para que una avería en la cocina no te deje sin luz en toda la casa y dejamos los enchufes y puntos de luz donde de verdad los vas a usar.

          En las reformas aprovechamos para cambiar el cableado antiguo, que suele ser la causa de muchos disparos y calentamientos, y para poner la toma de tierra al día. En locales y naves preparamos la instalación para la maquinaria, el alumbrado y, si hace falta, la fuerza trifásica.

          Antes de empezar te damos el presupuesto cerrado por escrito. Al terminar probamos cada circuito contigo, te explicamos el cuadro y te entregamos el certificado de instalación registrado en Industria.
      - titulo: Boletines y certificados
        texto: "Boletín (CIE) para dar de alta o subir la potencia."
        icono: certificado
        imagenes: "/fotos/servicio-medicion.jpg"
        detalle: |
          El boletín eléctrico, que hoy se llama certificado de instalación eléctrica (CIE), es el documento que pide la compañía para dar de alta la luz, cambiar de titular después de mucho tiempo sin suministro o subir la potencia contratada. Solo lo puede firmar una empresa instaladora autorizada.

          Vamos a la vivienda o al local, revisamos la instalación y medimos el aislamiento y la toma de tierra. Si todo está bien, hacemos el certificado y lo registramos en Industria para que puedas pedir el alta sin esperas. Si hay algo que arreglar antes, te lo explicamos con claridad y te damos el precio, sin obligarte a nada.

          También hacemos las revisiones periódicas que piden los locales de pública concurrencia, los garajes y algunas comunidades de vecinos.
      - titulo: Averías y urgencias
        texto: "Todos los días del año, también fines de semana."
        icono: alerta
        detalle: |
          Si te has quedado sin luz, saltan los diferenciales o huele a quemado, llámanos. Te atendemos todos los días del año y, al coger el teléfono, te decimos a qué hora podemos estar en tu casa, en tu comercio o en tu nave.

          Mientras llegamos, te explicamos por teléfono qué puedes revisar con seguridad: qué interruptor ha saltado, cómo desconectar un aparato sospechoso o cuándo es mejor no tocar nada. Muchas veces eso ya ayuda a localizar la avería.

          Al llegar buscamos el origen del problema, no solo el síntoma. Si la avería se puede reparar en el momento, la dejamos resuelta y probada. Si hace falta material especial, te damos el precio antes de seguir. El desplazamiento y la primera hora tienen un precio fijo que te decimos al llamar.
      - titulo: Cuadros eléctricos
        texto: "Cambio de cuadros viejos y protecciones nuevas."
        icono: cuadro
        imagenes: "/fotos/trabajo-cuadro.jpg; /fotos/trabajo-cuadro-antes.jpg"
        detalle: |
          Muchas casas de la Ribera siguen teniendo el cuadro de fusibles de hace cuarenta años, sin diferencial o con uno solo para toda la vivienda. Es lo primero que conviene cambiar: un cuadro al día protege a las personas de las descargas y a la instalación de los calentamientos.

          Sustituimos el cuadro por uno nuevo con interruptor general, diferenciales y magnetotérmicos para cada circuito, bien rotulados para que sepas qué es cada cosa. Si hace falta, separamos circuitos que estaban juntos, como la cocina y el resto de la casa, para que no salte todo a la vez.

          El cambio de un cuadro de vivienda suele hacerse en una mañana. Te avisamos de cuánto tiempo estarás sin luz y, al terminar, lo dejamos probado y con el certificado si lo necesitas para la compañía.
      - titulo: Puntos de recarga
        texto: "Cargadores para el coche eléctrico en casa o en el garaje."
        icono: cargador
        imagenes: "/fotos/trabajo-recarga.jpg"
        detalle: |
          Cargar el coche eléctrico en casa es lo más cómodo y lo más barato, pero no basta con un enchufe cualquiera. Instalamos el punto de recarga con su propia línea y sus protecciones, para que cargue cada noche con seguridad y sin que salte la luz.

          En una casa con garaje, llevamos la línea desde el cuadro y ajustamos la potencia para que puedas cargar sin subir la factura más de lo necesario. En un garaje comunitario, la línea va desde tu propio contador hasta tu plaza; solo hace falta comunicarlo a la comunidad y nosotros nos ocupamos del resto.

          Te asesoramos sobre el cargador que mejor encaja con tu coche y con tu instalación, hacemos la legalización y te ayudamos con la documentación de las ayudas que haya en ese momento.
      - { titulo: Iluminación LED, texto: "Ahorro en casas, comercios, naves y alumbrado exterior.", icono: bombilla }
      - { titulo: Autoconsumo solar, texto: "Placas en tejado para viviendas y pequeños negocios.", icono: solar }
      - { titulo: Antenas y telecomunicaciones, texto: "Antenas de televisión, redes de datos y porteros.", icono: antena }
      - { titulo: Domótica, texto: "Persianas, luces y calefacción desde el móvil.", icono: domotica }

