      - { texto: "Nos pusieron el cargador en el garaje de la comunidad y se encargaron de todos los papeles. Precio cerrado y sin sorpresas.", autor: Íñigo y Laura, nota: "Punto de recarga, Cintruénigo" }
      - { texto: "Necesitaba el boletín para dar de alta la luz del local y en tres días lo tenía registrado.", autor: Javier M., nota: "Boletín, Cascante" }

